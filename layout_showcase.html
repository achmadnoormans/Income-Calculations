  <style>
    :root {
      --tg-bg: #0e1621;
      --tg-chat-bg: #17212b;
      --tg-bubble: #242f3d;
      --tg-bubble-out: #2b5278;
      --tg-text: #f5f5f5;
      --tg-text-secondary: #7f91a4;
      --tg-accent: #5288c1;
      --tg-btn-bg: #2b5278;
      --tg-btn-hover: #356291;
      --tg-border: #232e3c;
      --sidebar-bg: #121b24;
      --card-highlight: #2f6ea5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--tg-bg);
      color: var(--tg-text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 340px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--tg-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--tg-border);
    }

    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header p {
      font-size: 12px;
      color: var(--tg-text-secondary);
      margin-top: 4px;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      padding: 12px 14px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item:hover {
      background: rgba(82, 136, 193, 0.1);
      border-color: rgba(82, 136, 193, 0.2);
    }

    .nav-item.active {
      background: var(--card-highlight);
      border-color: #4388c4;
      box-shadow: 0 4px 12px rgba(47, 110, 165, 0.3);
    }

    .nav-item-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-item-desc {
      font-size: 11px;
      color: #9ab4cf;
    }

    .nav-item.active .nav-item-desc {
      color: #d2e4f5;
    }

    /* Main Preview Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(circle at top right, #1b2838 0%, #0e1621 100%);
    }

    .preview-header {
      padding: 16px 24px;
      background: rgba(23, 33, 43, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--tg-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-title h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .preview-title span {
      font-size: 12px;
      color: var(--tg-text-secondary);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn-copy {
      background: var(--tg-accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background: #4275ab;
    }

    /* Telegram Chat Stage */
    .chat-stage {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .phone-mockup {
      width: 480px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Telegram Message Bubble */
    .tg-bubble {
      background: var(--tg-bubble);
      border-radius: 14px 14px 14px 4px;
      padding: 16px 18px;
      color: #ffffff;
      font-size: 13.5px;
      line-height: 1.55;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      position: relative;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tg-bubble code {
      font-family: 'Fira Code', monospace;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12.5px;
      color: #64b5f6;
    }

    .tg-bubble pre {
      font-family: 'Fira Code', monospace;
      background: rgba(10, 15, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 8px;
      margin: 8px 0;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #90caf9;
    }

    .tg-bubble blockquote {
      border-left: 3px solid var(--tg-accent);
      padding-left: 10px;
      margin: 8px 0;
      color: #cfd8dc;
      background: rgba(82, 136, 193, 0.08);
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
    }

    .tg-time {
      font-size: 10.5px;
      color: var(--tg-text-secondary);
      text-align: right;
      margin-top: 6px;
    }

    /* Telegram Inline Buttons */
    .tg-keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .tg-btn-row {
      display: flex;
      gap: 6px;
    }

    .tg-btn {
      flex: 1;
      background: rgba(43, 82, 120, 0.75);
      border: 1px solid rgba(82, 136, 193, 0.3);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tg-btn:hover {
      background: rgba(53, 98, 145, 0.95);
      border-color: #5288c1;
    }

    .tg-btn.primary {
      background: #23588f;
      border-color: #5aa1e3;
    }

    /* Design Concept Badge */
    .concept-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

          [
            { text: "🔙 Ganti Posisi" },
            { text: "🏠 Menu" }
          ]
        ]
      }
    ];

    let currentIndex = 0;

    function renderNav() {
      const list = document.getElementById('navList');
      list.innerHTML = DESIGNS.map((d, index) => `
        <button class="nav-item ${index === currentIndex ? 'active' : ''}" onclick="selectDesign(${index})">
          <div class="nav-item-title">
            <span>#${d.id}</span>
            <span>${d.name}</span>
          </div>
          <div class="nav-item-desc">${d.tag}</div>
        </button>
      `).join('');
    }

    function selectDesign(index) {
      currentIndex = index;
      renderNav();
      const d = DESIGNS[index];
      document.getElementById('currentTitle').innerText = `#${d.id} - ${d.name}`;
      document.getElementById('currentSubtitle').innerText = d.desc;

      // Render bubble
      let formattedText = d.content
        .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
        .replace(/_(.*?)_/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>');

      // Check if terminal style
      if (d.id === 2) {
        formattedText = `<pre>${d.content}</pre>`;
      }

      document.getElementById('bubbleContent').innerHTML = `
        <div class="concept-badge" style="background: ${d.color}25; color: ${d.color}; border: 1px solid ${d.color}60;">
          KONSEP #${d.id}: ${d.tag}
        </div>
        <div>${formattedText}</div>
        <div class="tg-time">11.19 ✓✓</div>
      `;

      // Render buttons
      const kbHtml = d.buttons.map(row => `
        <div class="tg-btn-row">
          ${row.map(b => `<div class="tg-btn ${b.primary ? 'primary' : ''}">${b.text}</div>`).join('')}
        </div>
      `).join('');
      document.getElementById('keyboardContent').innerHTML = kbHtml;
    }

    function copyCurrentMarkdown() {
      const d = DESIGNS[currentIndex];
      navigator.clipboard.writeText(d.content).then(() => {
        alert("✅ Format Markdown Desain #" + d.id + " berhasil disalin ke clipboard!");
      });
    }

    // Init
    renderNav();
    selectDesign(0);
  </script>
</body>
</html>
